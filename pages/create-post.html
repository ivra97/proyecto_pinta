<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="crear publicación, publicar contenido, foro de videojuegos, comunidad gamer, videojuegos,
    compartir imágenes, compartir experiencias, publicaciones gaming, reseñas de videojuegos, opiniones de jugadores, capturas de pantalla, 
    juegos online, videojuegos multijugador, comunidad de jugadores, contenido gamer, crear post, videojuegos PC, videojuegos consola, videojuegos móviles, 
    PINTA"
    />

    <meta
      name="description"
      content="Creá una nueva publicación en PINTA para compartir imágenes, opiniones y experiencias sobre tus videojuegos favoritos."
    />
    <title>Crear Publicacion | PINTA</title>
    <link rel="icon" href="../img/logo.pinta.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/9d24d76722.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="grid-container grid-container--create-post">
      <header class="main-header main-header--create-post">
        <h1 class="title-header">PINTA</h1>
      </header>

      <aside class="asidebar asidebar--create-post">
        <nav class="sidebar-nav">
          <div class="nav-top nav-top-aside">
            <a href="feed.html" class="nav-item">
              <i class="fa-solid fa-house"></i>
              <span class="desktop-text-aside">Inicio</span>
            </a>

            <a href="search-profile.html" class="nav-item">
              <i class="fa-solid fa-magnifying-glass-plus"></i>
              <span class="desktop-text-aside">Buscar Usuarios</span>
            </a>

            <a href="create-post.html" class="nav-item active">
              <i class="fa-solid fa-circle-plus"></i>
              <span class="desktop-text-aside">Crear Post</span>
            </a>
          </div>

          <hr />

          <div class="nav-bottom nav-bottom-aside">
            <button class="button-mode" id="mode">
              <i class="fa-solid fa-moon"></i>
              <span class="desktop-text-aside">Modo Oscuro</span>
            </button>
            <a href="privacy-policy.html" class="nav-item">
              <i class="fa-regular fa-file-lines"></i>
              <span class="desktop-text-aside">Políticas de privacidad</span>
            </a>
            <a href="../index.html" class="logout-link nav-item">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span class="desktop-text-aside">Cerrar sesion</span>
            </a>
          </div>
        </nav>
      </aside>
      <main class="main-content main-content--create-post">
        <div class="create-post-container">
          <div class="create-post-header">
            <a
              href="profile.html"
              class="back-button-header"
              aria-label="Volver al perfil"
            >
              <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2>Crear Publicación</h2>
            <button class="button-mode button-mode-compact mobile-page-mode">
              <i class="fa-solid fa-moon"></i>
            </button>
          </div>

          <div class="create-post-form-section">
            <form class="create-post-form">
            <div class="form-group">
              <label for="title">Título</label>
              <input
                type="text"
                id="title"
                name="title"
                maxlength="50"
                placeholder="Ingrese un título"
                required
              />
            </div>

            <div class="form-group">
              <label for="image-upload">Imagen</label>
              <input
                type="file"
                id="image-upload"
                name="image"
                accept="image/*"
              />
            </div>

            <div class="form-group">
              <label for="description">Descripción</label>
              <textarea
                id="description"
                name="description"
                maxlength="500"
                rows="6"
                placeholder="Ingrese una descripción"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="game-name">Nombre del juego</label>
              <input
                type="text"
                id="game-name"
                name="game-name"
                maxlength="50"
                placeholder="Ingrese el nombre del juego"
                required
              />
            </div>

              <button type="submit" class="publish-button">Publicar</button>
            </form>
          </div>
        </div>
      </main>

      <footer class="main-footer main-footer--create-post">
        <p>
          <a href="https://opensource.org/license/MIT"
            >Pinta, Inc ⓒ 2026 MIT License</a
          >
        </p>
      </footer>
    </div>
    <script type="module" src="../js/mode.js"></script>
  </body>
</html>
